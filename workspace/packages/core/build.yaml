targets:
  $default:
    sources:
      - lib/**
      - pubspec.yaml
      - $package$
      - "!build/**"
    builders:
      drift_dev:
        options:
          databases:
            default: lib/src/storage/drift/app_database.dart
          sql:
            dialect: sqlite
            options:
              version: "3.38"
              modules:
                - fts5
