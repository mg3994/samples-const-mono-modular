# This file configures the static analysis results for your project (errors,
# warnings, and lints).
#
# This enables the 'recommended' set of lints from `package:lints`.
# This set helps identify many issues that may lead to problems when running
# or consuming Dart code, and enforces writing Dart using a single, idiomatic
# style and format.
#
# If you want a smaller set of lints you can change this to specify
# 'package:lints/core.yaml'. These are just the most critical lints
# (the recommended set includes the core lints).
# The core lints are also what is used by pub.dev for scoring packages.

include: package:lints/recommended.yaml
analyzer:
  plugins:
    - custom_lint
custom_lint:
  rules:
    # ====================
    # Core Framework Rules
    # ====================
    - avoid_duplicate_event_handlers: warning
    - require_super_on_event: error
    - avoid_stream_transformers_on_bloc_signal: warning
    - avoid_direct_signal_mutation_outside_bloc: error
    - avoid_top_level_bloc_signal_instances: warning
    - require_cubit_signal_mixin_init: error
    - avoid_raw_signal_effects_in_bloc: warning
    - prefer_named_replay_constructor: warning
    - require_emit_in_helper_name: warning
    - avoid_multiple_synchronous_emits: warning

    # ====================
    # Flutter UI Rules
    # ====================
    - avoid_emit_in_build: error
    - avoid_unmanaged_signal_effects: warning
    - prefer_bloc_signal_provider_read_in_callbacks: warning
    - avoid_providing_existing_instance_with_create: warning
    - avoid_manual_close_on_provided_bloc: warning
    - avoid_invalid_context_select_generics: error
    - avoid_context_watch_for_bloc_state: warning
    - avoid_unused_select_result: info
# Uncomment the following section to specify additional rules.

# linter:
#   rules:
#     - camel_case_types

# analyzer:
#   exclude:
#     - path/to/excluded/files/**

# For more information about the core and recommended set of lints, see
# https://dart.dev/go/core-lints

# For additional information about configuring this file, see
# https://dart.dev/tools/analysis
