services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: blogstore
      POSTGRES_PASSWORD: "EStQCH8xkIVW9JyVKr0G7BFsVQkus7AF"
    volumes:
      - blogstore_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "X-6UojtNt4zo0km9GTKV5LSusPqylnQ4"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: blogstore_test
      POSTGRES_PASSWORD: "Sk1QWrW4hOGaGkzHybewqgkYQ0fWwcHg"
    volumes:
      - blogstore_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "modq__goobL-4DwFGGWjgaz20FruUofT"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  blogstore_data:
  blogstore_test_data:
